<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050308" />
<meta name="robots" content="noindex" />
<title>AURA · Erreur 403</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --rose:#FF4D6D;--coral:#FF8A5B;--violet:#C9184A;
    --grad:linear-gradient(135deg,var(--rose),var(--coral));
    --glow:0 0 40px #FF4D6D66;
    --ink:#050308;--ink-2:#0C0912;--text:#F6F0F8;--muted:#9E90AA;
    --surface:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);
    --glass:rgba(14,9,20,.5);--glass-brd:rgba(255,255,255,.13);
    --shadow:0 24px 60px -18px rgba(0,0,0,.85);
    --fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif;--fm:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--fb);color:var(--text);background:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:24px;-webkit-font-smoothing:antialiased}
  button,a{font-family:inherit}
  ::selection{background:var(--rose);color:#fff}
  #bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;filter:blur(18px) saturate(1.35);opacity:.8}
  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:460px}

  /* ===== SCÈNE 3D ===== */
  .scene{perspective:1000px;width:230px;height:230px;position:relative;margin-bottom:6px}
  .gyro{position:absolute;inset:0;transform-style:preserve-3d;animation:gyro 18s linear infinite}
  @keyframes gyro{to{transform:rotateY(360deg) rotateX(360deg)}}
  .ring{position:absolute;border-radius:50%;transform-style:preserve-3d;box-shadow:0 0 18px -2px var(--rose)}
  .r1{inset:6px;border:2px solid var(--rose);animation:s1 6s linear infinite}
  .r2{inset:30px;border:2px solid var(--coral);animation:s2 8s linear infinite reverse}
  .r3{inset:54px;border:2px dashed var(--violet);animation:s3 5s linear infinite}
  @keyframes s1{to{transform:rotateX(360deg) rotateZ(120deg)}}
  @keyframes s2{to{transform:rotateY(360deg) rotateZ(-90deg)}}
  @keyframes s3{to{transform:rotateX(-360deg) rotateY(180deg)}}
  .core{position:absolute;inset:80px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 55%),var(--grad);display:grid;place-items:center;font-size:42px;box-shadow:var(--glow),inset 0 -6px 14px rgba(0,0,0,.35);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(.9)}}
  .orbit{position:absolute;inset:0;transform-style:preserve-3d;animation:orb 9s linear infinite}
  @keyframes orb{to{transform:rotateY(360deg)}}
  .orbit i{position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--coral);box-shadow:0 0 12px var(--coral);transform:translateX(112px)}
  .orbit i:nth-child(2){background:var(--violet);box-shadow:0 0 12px var(--violet);transform:rotateY(120deg) translateX(112px)}
  .orbit i:nth-child(3){background:var(--rose);box-shadow:0 0 12px var(--rose);transform:rotateY(240deg) translateX(112px)}

  /* ===== CODE ===== */
  .code{font-family:var(--fd);font-weight:800;font-size:clamp(84px,26vw,140px);line-height:.9;letter-spacing:-4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;transform-style:preserve-3d;animation:float3d 6s ease-in-out infinite;filter:drop-shadow(0 8px 30px #FF4D6D55)}
  @keyframes float3d{0%,100%{transform:rotateY(-14deg) rotateX(6deg)}50%{transform:rotateY(14deg) rotateX(-6deg) translateZ(24px)}}
  .badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--fm);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:6px 14px;border-radius:999px;margin-bottom:20px}
  .badge .g{width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 10px var(--rose)}
  h1{font-family:var(--fd);font-weight:800;font-size:clamp(24px,6vw,32px);margin:10px 0 8px;letter-spacing:-.5px}
  p{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:360px;margin-bottom:26px}
  .home{display:inline-flex;align-items:center;gap:9px;padding:15px 26px;border-radius:15px;font-weight:800;font-size:15px;background:var(--grad);color:#fff;box-shadow:var(--glow);text-decoration:none;transition:transform .12s,filter .2s}
  .home:active{transform:scale(.95)}
  .alt{margin-top:14px;font-size:12.5px;color:var(--muted);text-decoration:none}
  .alt a{color:var(--text);font-weight:600;text-decoration:none;border-bottom:1px solid var(--border)}
  .sign{position:fixed;bottom:18px;left:0;right:0;z-index:2;font-family:var(--fm);font-size:10px;color:var(--muted);opacity:.6}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  @media(max-width:400px){.scene{width:190px;height:190px}.orbit i{transform:translateX(92px)}.orbit i:nth-child(2){transform:rotateY(120deg) translateX(92px)}.orbit i:nth-child(3){transform:rotateY(240deg) translateX(92px)}.core{inset:66px;font-size:34px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <div class="scene">
    <div class="gyro"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core">🚫</div></div>
    <div class="orbit"><i></i><i></i><i></i></div>
  </div>
  <div class="code">403</div>
  <div class="badge"><span class="g"></span>Erreur 403</div>
  <h1>Accès interdit</h1>
  <p>Tu n'as pas les autorisations pour voir cette page. Si tu penses que c'est une erreur, reviens à l'accueil.</p>
  <a class="home" href="index.html">← Retour à l'accueil</a>
  <div class="alt">…ou <a href="app.html">ouvrir l'app</a></div>
</div>
<div class="sign">@ By Brice Jct · Alpha OS · Groupe Alpha Nex Strasbourg</div>
<script>
(function(){var cv=document.getElementById('bg'),ctx=cv.getContext('2d'),w,h,parts=[];
 function rs(){w=cv.width=Math.floor(innerWidth*Math.min(devicePixelRatio,2));h=cv.height=Math.floor(innerHeight*Math.min(devicePixelRatio,2));}
 rs();addEventListener('resize',rs);
 for(var i=0;i<52;i++)parts.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.5,vx:(Math.random()-.5)*.0005,vy:(Math.random()-.5)*.0005,a:Math.random()*.5+.15});
 var t=0,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 var blobs=[[.22,.15,'#FF4D6D'],[.8,.12,'#C9184A'],[.5,.92,'#FF8A5B'],[.12,.72,'#FF4D6D']];
 function frame(){t+=.005;ctx.clearRect(0,0,w,h);
   for(var i=0;i<blobs.length;i++){var b=blobs[i],x=(b[0]+Math.sin(t+i*1.3)*.07)*w,y=(b[1]+Math.cos(t*.8+i)*.07)*h,g=ctx.createRadialGradient(x,y,0,x,y,w*.55);g.addColorStop(0,b[2]+'70');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
   ctx.fillStyle='rgba(255,255,255,.5)';
   for(var j=0;j<parts.length;j++){var p=parts[j];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>1)p.vx*=-1;if(p.y<0||p.y>1)p.vy*=-1;ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x*w,p.y*h,p.r*Math.min(devicePixelRatio,2),0,7);ctx.fill();}
   ctx.globalAlpha=1;if(!reduce)requestAnimationFrame(frame);}
 frame();
})();
</script>
</body>
</html>
